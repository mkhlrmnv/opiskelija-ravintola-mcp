[project]
name = "opiskelija-ravintola-mcp"
version = "0.1.0"
description = "MCP server for Finnish student restaurant lunch menus and per-dish macros"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
opiskelija-ravintola-mcp = "ravintola_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ravintola_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real restaurant websites (deselected by default)"]
addopts = "-m 'not live'"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
